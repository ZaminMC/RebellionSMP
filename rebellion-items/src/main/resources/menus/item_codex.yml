# Item codex: an informational menu showing the rarity ladder.
# Deliberate DeluxeMenus-shaped subset (see docs/DELUXEMENUS_COMPATIBILITY.md).

menu_title: "<gold>Item Codex</gold>"
size: 27
open_command: itemcodex

items:
