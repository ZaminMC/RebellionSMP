name: CI

# Pull-request validation + read-only push validation of main.
# push-to-develop is owned by release.yml, which runs the same wrapper
# build + tests and publishes the prerelease — a develop push is never
# built twice.

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build and test all modules
        run: ./gradlew build --no-daemon

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            rebellion-api/build/libs/RebellionAPI-*.jar
            rebellion-core/build/libs/RebellionCore-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Fail on missing plugin descriptors
        run: |
          for jar in rebellion-api/build/libs/RebellionAPI-*.jar rebellion-core/build/libs/RebellionCore-*.jar; do
            unzip -l "$jar" | grep -q "plugin.yml" || { echo "MISSING plugin.yml in $jar"; exit 1; }
          done
