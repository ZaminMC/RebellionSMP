# RebellionArtifacts configuration.
#
# Loaded and validated by net.zaminmc.rebellion.artifacts.ArtifactsConfig
# (tested in ArtifactsConfigTest). Invalid values are loud load errors: the
# module refuses to enable and Core reports the exact keys — nothing is
# silently stretched or defaulted behind the operator's back.
#
# This module is the Phase 6 groundwork slice (ADR-0013): the three
# dimension-artifact state machines — dimension-keyed registry,
# instance-stamped possession, recoverable loss with a return pipeline, and
# the idempotent Rebellion event. There is no plugin wiring yet (no
# commands, listeners or physical item flows); this file ships now so the
# persistence contract is visible to operators. Power cooldowns, catastrophe
# effects and encounter tuning are deliberately absent until the
# controller phase exists.
#
# See docs/decisions/ADR-0013-dimension-artifact-registry.md for the state
# machine model.

artifacts:
  # Protected origin realm of each artifact: where it rests while ORIGIN,
  # where the return pipeline brings it home, and where the discoverable
  # encounter lives (encounter structure itself is controller-phase work).
  # These anchors are CONFIG-OWNED world-setup data, not gameplay state:
  # the service re-syncs the rows to these values on every load, so
  # calibrating them when the map is imported is safe. Defaults use the
  # conventional dimension world names and a spawn-ish anchor — an honest
  # placeholder until the operator calibrates the realms.
  origins:
    overworld:
      # Overworld artifact — theme of life/dominion.
      world: world
      x: 0
      y: 64
      z: 0
    nether:
      # Nether artifact — theme of fire/destruction/war.
      world: world_nether
      x: 0
      y: 64
      z: 0
    end:
      # End artifact — theme of void/knowledge/dimensional influence.
      world: world_the_end
      x: 0
      y: 64
      z: 0

  return:
    # How long a LOST or SPENT artifact must wait before the return sweep
    # may route it back toward its protected origin (seconds). 0 makes a
    # lost artifact return-eligible immediately. The sweep also refuses to
    # run while a Rebellion event occurrence is active (the "event check",
    # master prompt 5.5). Bounded at load to 0..2592000 (30 days).
    delay-seconds: 3600

  rebellion-event:
    # Master switch for the Rebellion event trigger. When false, no
    # occurrence can be triggered (FEATURE_DISABLED) until an operator
    # re-enables it.
    enabled: true
    # Trigger scope. Only HOLDER is implemented: one player controlling all
    # three unique artifacts. A team-wide scope must be a separate explicit
    # configuration option (master prompt 5.5) and is rejected loudly here
    # as unimplemented — never a silent stretch.
    trigger-scope: HOLDER

  # ---------------------------------------------------------------------------
  # Controller values (ADR-0015) — the physical surface players touch.
  # ---------------------------------------------------------------------------

  items:
    # The physical item material of each artifact (what the origin
    # presentation displays and what holders carry). Must be a valid item
    # material; display name and lore come from messages.yml so operators
    # skin the items without touching identity. Themes (master prompt 5.5):
    overworld:
      # Overworld — theme of life/dominion.
      material: HEART_OF_THE_SEA
    nether:
      # Nether — theme of fire/destruction/war.
      material: NETHER_STAR
    end:
      # End — theme of void/knowledge/dimensional influence.
      material: ENDER_EYE

  sweep:
    # Cadence of the maintenance sweep: the return pipeline (LOST/SPENT ->
    # RETURNING -> ORIGIN), the origin-presentation reconcile, and the
    # event-duration completion all ride this one task. Bounded 5..600 s.
    interval-seconds: 30

  event:
    # How long one Rebellion occurrence stays ACTIVE before the sweep
    # completes it (the guard clears, the world can reconquer). Bounded
    # 5..1440 minutes. Admins can force-complete earlier
    # (/artifactadmin complete confirm).
    duration-minutes: 60
    # While an occurrence is ACTIVE, remind every online player every N
    # minutes (0 disables the reminder; the trigger broadcast and the
    # join-time notice always render). Bounded 0..1440.
    reminder-minutes: 10

  purge:
    # The explicitly configured world-wide kill power (master prompt 5.5,
    # ADR-0015 §4). Catastrophic, expensive, OPT-IN: default false.
    # When enabled it is still quadruple-gated at runtime: an ACTIVE
    # occurrence must exist, the actor must be its trigger holder, the
    # min-delay telegraph must have elapsed since the trigger, and the
    # literal "confirm" keyword is required. The once-per-occurrence
    # stamp (schema v2) makes it structurally impossible to run twice.
    enabled: false
    # Who is killed. ONLINE is the only implemented target set: every
    # player currently online. STORED (all stored player records) needs a
    # profiles module to enumerate records and is rejected loudly as
    # unimplemented — never a silent stretch.
    target-set: ONLINE
    # Never accidentally kill the activating holder (master prompt 5.5).
    # Set false only if the configured rules should explicitly say so.
    spare-holder: true
    # The telegraph: minutes after the trigger before the purge may be
    # confirmed at all. Bounded 0..1440.
    min-delay-minutes: 10
    # Final warning lead: seconds between the global warning broadcast and
    # the kill loop. Bounded 5..600.
    warning-seconds: 30
