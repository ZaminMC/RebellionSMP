# RebellionCore messages. Formatted with MiniMessage: https://docs.advntr.dev/minimessage
# Argument placeholders like <value> are filled by the code; do not rename them.
# Validation contract: every tag must be explicitly closed. An unclosed tag like
# "<red>text" is rejected at load time with a precise key, because it is the most
# common copy/paste editing mistake.

prefix: "<gradient:#c0392b:#8e44ad>Rebellion</gradient> <dark_gray>»</dark_gray> <gray></gray>"

common:
  no-permission: "<red>You do not have permission to do that.</red>"
  player-only: "<red>This command can only be used by players.</red>"
  internal-error: "<red>Something went wrong. Quote incident <white><incident></white> to staff.</red>"
  unknown-subcommand: "<red>Unknown subcommand. Try <white>/rebellion status</white>.</red>"

status:
  header: "<gold>RebellionSMP status</gold>"
  version: "<gray>Core <white><version></white>, API <white><api></white></gray>"
  # <state> is a bare runtime placeholder resolved by the status command
  # (Placeholder.component). MiniMessage placeholder tags have no closing
  # form — a paired </state> would leak as literal text (caught live on
  # Paper 26.3: the status line rendered "... (healthy)</state>").
  backend: "<gray>Database backend: <white><backend></white><state></gray>"
  backend-ok: " <green>(healthy)</green>"
  backend-degraded: " <red>(degraded)</red>"
  pool: "<gray>Persistence queue: <white><queued></white> queued, <white><active></white> active, <white><completed></white> completed</gray>"
  migration: "<gray>Migrations applied: <white><applied></white> across <white><modules></white> module(s)</gray>"
  uptime: "<gray>Uptime: <white><uptime></white></gray>"

modules:
  header: "<gold>Registered modules</gold>"
  line: "<gray>- <white><name></white> <dark_gray>(<key>)</dark_gray> <state> <gray><detail></gray></gray>"
  empty: "<gray>No modules registered.</gray>"
  state-operational: "<green>operational</green>"
  state-degraded: "<yellow>degraded</yellow>"
  state-failed: "<red>failed</red>"
  state-pending: "<yellow>pending</yellow>"
  state-disabled: "<dark_gray>disabled</dark_gray>"

diagnose:
  started: "<gray>Writing diagnostic report…</gray>"
  written: "<green>Report written to <white><path></white> (incident <white><incident></white>).</green>"

reload:
  started: "<gray>Reloading configuration and messages…</gray>"
  success: "<green>Reloaded configuration and messages.</green>"
  failed: "<red>Reload rejected; previous configuration stays active. Fix these issues:</red>"
  issue: "<red>- <path>: <message></red>"
  database-note: "<yellow>database.yml is validated but not re-applied; restart the server to change the database.</yellow>"
